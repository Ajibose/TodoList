services:
  db:
    ports: 
      - "5432:5432"
    environment:
      - "POSTGRES_PASSWORD=dev"
      - "POSTGRES_DB=tasks"
    image: postgres
    volumes:
      - "taskdata:/var/lib/postgresql"

  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgres://postgres:dev@db:5432/tasks
    depends_on:
      - db

volumes:
  taskdata: